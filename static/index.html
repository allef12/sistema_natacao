<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Sistema Natação</title>

        <link rel="stylesheet" href="/static/style.css">

        <script src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2"></script>
    </head>

    <body>
        <aside class="barra-lateral">
            
            <div class="logo">
                <i class="ph ph-waves"></i>
                <h2>Escola Natação</h2>
            </div>

            <nav class="menu">
                <button class="botao-navegacao ativo"><i class="ph ph-user"></i>Aluno</button>
                <button class="botao-navegacao"><i class="ph ph-currency-dollar"></i>Pagamentos</button>
                <button class="botao-navegacao"><i class="ph ph-chart-bar"></i>Relatórios</button>
            </nav>

        </aside>

        <main class="conteudo-principal">
            <header class="barra-superior">
                <h1>Sistema Natação</h1>
                <span class="selo-usuario"><i class="ph ph-user-circle"></i>Administrador</span>
            </header>

            <section class="grade-estatisticas">
                <div class="cartao-estatistica">
                    <div>
                        <p>Total de Alunos</p>
                        <h3 id="stat-total">0</h3>
                    </div>
                    <i class="ph ph-users-three icone-azul"></i>
                </div>

                <div class="cartao-estatistica">
                    <div>
                        <p>Alunos Ativos</p>
                        <h3 id="stat-ativos">0</h3>
                    </div>
                    <i class="ph ph-check-circle icone-verde"></i>
                </div>

                <div class="cartao-estatistica">
                    <div>
                        <p>Inadimplentes</p>
                        <h3 id="stat-pendentes">0</h3>
                    </div>
                    <i class="ph ph-warning-circle icone-vermelho"></i>
                </div>
            </section>

            <!-- Área de cadastro e tabela -->
            <div class="grade-painel">
                <section class="cartao cartao-formulario">
                    <h2><i class="ph ph-user-plus"></i>Cadastrar Aluno</h2>

                    <form id="form-aluno">
                        <div class="grupo-formulario">
                            <label for="nome">Nome</label>
                            <input type="text" id="nome" placeholder="Digite o nome" required>
                        </div>
                    </form>
                </section>
            </div>
        </main>
    </body>
</html>
