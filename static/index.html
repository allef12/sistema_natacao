<!DOCTYPE>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Sistema Natação</title>

        <link rel="stylesheet" href="/static/style.css">

        <script src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2"></script>
    </head>

    <body>
        <aside class="sidebar">
            
            <div class="logo"><i class="ph ph-waves"></i>
            <h2>Escola Natação</h2>
            </div>

            <nav class="menu">
                <button class="nav-btn active"><i class="ph ph-user"></i>Aluno</button>
                <button class="nav-btn"><i class="ph ph-currency-dollar"></i>Pagamentos</button>
                <button class="nav-btn"><i class="ph ph-chart-bar"></i>Relatórios</button>
            </nav>

            
        </aside>

        <main class="main-content">
                <header class="top-bar">
                    <h1>Sistema Natação</h1>
                    <span class="user-badge"><i class="ph ph-user-circle"></i>Administrador</span>
                </header>


                <section class="stats-grid">
                <div class="stat-card">
                    <div>
                        <p>Total de Alunos</p>
                        <h3 id="stat-total"></h3>
                    </div>
                    <i class="ph ph-users-three"></i>
                </div>

                <div class="stat-card">
                    <div>
                        <p>Alunos Ativos</p>
                        <h3 id="stat-ativos">0</h3>
                    </div>
                    <i class="ph ph-check-circle icon-green"></i>
                </div>

                <div class="stat-card">
                    <div>
                        <p>Inadimplentes</p>
                        <h3 id="stat-pendentes">0</h3>
                         <i class="ph ph-warning-circle icon-red"></i>

                    </div>

                </div>

            </section>
            </main>
    </body>
</html>
